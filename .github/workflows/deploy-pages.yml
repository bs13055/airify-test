name: Deploy Airify frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airify_all_code/apps/web
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: airify_all_code/apps/web/package-lock.json
      - name: Install frontend packages
        run: npm ci
      - name: Check assignment pages
        run: node scripts/check-gp1.cjs
      - name: Build GitHub Pages site
        run: npm run build -- --mode github-pages
        env:
          VITE_API_BASE_URL: ${{ vars.AIRIFY_API_BASE_URL }}
      - name: Prepare and check assignment entry point
        run: |
          node scripts/prepare-gp1-pages.cjs
          node scripts/check-gp1-pages.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: airify_all_code/apps/web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
