# Airify reverse proxy (Nginx) — reference config for EC2/Docker.
# Serves the built web app and proxies the API. No secrets here.
# For HTTPS, terminate TLS here (Certbot) or use Caddy (see SSL runbook).

server {
    listen 80;
    server_name _;

    # --- Web app (static built Vite bundle) ---
    root /usr/share/nginx/html;
    index index.html;

    # SPA: hash routing is primary; also serve index.html for bare paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API proxy ---
    # Frontend calls /v1/... ; forward to the API service.
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health + version passthrough for smoke tests.
    location = /healthz { proxy_pass http://api:8000/healthz; }
    location = /version { proxy_pass http://api:8000/version; }

    # Static asset caching (optional).
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
