[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airify-backend"
version = "0.0.1"
description = "Airify — PM2.5 Early Risk Intelligence Platform (codebase skeleton / bootstrap)"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"

# NOTE: This is an environment/codebase skeleton.
# No live provider integration and no PM2.5 prediction logic is implemented yet.
# Intentionally NO network client libraries (requests/httpx/aiohttp), no boto3,
# no cloud/AI SDKs, and no ML packages are included. Providers must stay offline stubs.
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Test/dev dependencies.
# starlette's TestClient requires httpx as a TEST-ONLY transport. It is used solely
# by the in-process test client and MUST NOT be used for any provider network calls.
test = [
    "pytest>=8.0",
    "httpx>=0.27",  # test-only: required by starlette.testclient.TestClient
]
# uvicorn is only needed to run the API locally (see README). Not required for tests.
run = [
    "uvicorn>=0.29",
]

# The importable package `app` lives under `apps/api/`, so package discovery must be
# explicit (otherwise editable installs fail with "Multiple top-level packages
# discovered in a flat-layout"). Paths are relative to this file (airify_all_code/).
[tool.setuptools]
package-dir = { "" = "apps/api" }

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/app/tests"]
pythonpath = ["apps/api"]
